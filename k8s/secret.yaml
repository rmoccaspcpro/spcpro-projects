apiVersion: v1
kind: Secret
metadata:
  name: spcpro-projects-secrets
  namespace: spcpro
type: Opaque
stringData:
  # ============================================================================
  # INSTRUCCIONES PARA CONFIGURAR LOS SECRETS
  # ============================================================================
  #
  # Este archivo es una plantilla. NO debe contener valores reales de contraseñas.
  #
  # Para configurar los secrets en Kubernetes, sigue estos pasos:
  #
  # OPCIÓN 1: Crear el secret directamente desde kubectl
  # ------------------------------------------------------
  # kubectl create secret generic spcpro-projects-secrets \
  #   --from-literal=SPCPRO_DEFAULT_ADMIN_EMAIL=tu-email@ejemplo.com \
  #   --from-literal=SPCPRO_DEFAULT_ADMIN_PASSWORD='TuContraseñaSegura!' \
  #   --namespace=spcpro
  #
  # OPCIÓN 2: Usar un archivo local (NO versionado en git)
  # -------------------------------------------------------
  # 1. Crea un archivo local llamado 'secret.local.yaml' (ya está en .gitignore)
  # 2. Copia este archivo y reemplaza los valores de ejemplo con valores reales
  # 3. Aplica el secret: kubectl apply -f k8s/secret.local.yaml
  #
  # OPCIÓN 3: Usar variables de entorno + envsubst
  # -----------------------------------------------
  # export SPCPRO_DEFAULT_ADMIN_EMAIL=tu-email@ejemplo.com
  # export SPCPRO_DEFAULT_ADMIN_PASSWORD='TuContraseñaSegura!'
  # envsubst < k8s/secret.yaml | kubectl apply -f -
  #
  # OPCIÓN 4: Usar herramientas de gestión de secrets (RECOMENDADO para producción)
  # -------------------------------------------------------------------------------
  # - Sealed Secrets: https://github.com/bitnami-labs/sealed-secrets
  # - External Secrets Operator: https://external-secrets.io/
  # - HashiCorp Vault: https://www.vaultproject.io/
  #
  # ============================================================================
  
  # Credenciales admin iniciales (se crea si el usuario no existe)
  # IMPORTANTE: Reemplaza estos valores con credenciales reales antes de aplicar
  SPCPRO_DEFAULT_ADMIN_EMAIL: "CAMBIAR-POR-EMAIL-REAL"
  SPCPRO_DEFAULT_ADMIN_PASSWORD: "CAMBIAR-POR-PASSWORD-SEGURA"

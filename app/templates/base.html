<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "SPC Pro Projects" }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Slab:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#752645">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.svg">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
      <div class="container">
        <a class="navbar-brand" href="/">SPC Pro Projects</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <div class="ms-auto d-flex flex-column flex-lg-row gap-2 align-items-start align-items-lg-center">
            {% if current_user %}
              <a class="btn btn-outline-secondary btn-sm" href="/">Dashboard</a>
              <a class="btn btn-outline-secondary btn-sm" href="/clients">Clientes</a>
              <a class="btn btn-outline-primary btn-sm" href="/report">Reporte</a>
              {% if current_user.is_admin %}
                <a class="btn btn-outline-secondary btn-sm" href="/users">Usuarios</a>
                <a class="btn btn-outline-secondary btn-sm" href="/team">Equipo</a>
              {% endif %}
              <div class="d-flex align-items-center px-2 small text-muted">{{ current_user.email }}</div>
              <form method="post" action="/logout" class="m-0">
                {% include "_csrf.html" %}
                <button class="btn btn-outline-danger btn-sm" type="submit">Salir</button>
              </form>
            {% else %}
              <a class="btn btn-outline-primary btn-sm" href="/login">Ingresar</a>
            {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% if message %}
        <div class="alert alert-info">{{ message }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('Service worker registered.', reg);
          }).catch(function(err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>

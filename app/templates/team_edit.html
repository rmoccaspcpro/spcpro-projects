{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-start mb-3">
  <div>
    <h1 class="h3 m-0">Editar miembro</h1>
    <div class="text-muted">Equipo</div>
  </div>
  <div>
    <a class="btn btn-outline-secondary" href="/team">Volver</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" action="/team/{{ member.id }}">
      {% include "_csrf.html" %}
      <div class="row g-2">
        <div class="col-6">
          <label class="form-label">Nombre</label>
          <input class="form-control" name="name" value="{{ member.name }}" required />
        </div>
        <div class="col-6">
          <label class="form-label">Sueldo mensual</label>
          <input class="form-control" name="monthly_salary" type="text" inputmode="decimal" value="{{ member.monthly_salary|money }}" />
        </div>
        <div class="col-12">
          <div class="form-check mt-2">
            <input class="form-check-input" id="active" name="active" type="checkbox" value="1" {% if member.active %}checked{% endif %} />
            <label class="form-check-label" for="active">Activo</label>
          </div>
        </div>
      </div>

      <div class="mt-3">
        <button class="btn btn-primary" type="submit">Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
